[pytest]
# 仓库里带了一份用于离线装机的 Python 运行时（deploy/kylin/assets/runtime），
# 里面有上千个第三方库自带的 test_*.py。不限定范围时裸跑 `pytest` 会去收集它们
# 并以 81 个 collection error 中断，掩盖本项目的真实结果。
# 日常回归只收集当前算法及接口；兼容和发布检查用显式目录运行。
# pytest tests 仍收集所有组，不通过 skip/xfail 排除测试。
testpaths = tests/unit
norecursedirs = deploy dist build .git *.egg-info
